services:
  face-recognizer:
    platform: linux/amd64
    build:
      context: ./services/face-recognizer
      dockerfile: Dockerfile
      args:
        HF_REPO_ID: biometric-ai-lab/Face_Recognition
    environment:
      HF_REPO_ID: biometric-ai-lab/Face_Recognition
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  face-embedding-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: sh -c "npm run face:embed:worker"
    environment:
      DATABASE_URL: postgresql://appuser:apppass@db:5432/app_dev
      FACE_RECOGNIZER_URL: http://face-recognizer:8000
      FACE_EMBEDDING_POLL_INTERVAL_MS: ${FACE_EMBEDDING_POLL_INTERVAL_MS:-10000}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      face-recognizer:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: sh -c "npm run db:migrate"
    environment:
      DATABASE_URL: postgresql://appuser:apppass@db:5432/app_dev
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: sh -c "npm run db:seed"
    environment:
      DATABASE_URL: postgresql://appuser:apppass@db:5432/app_dev
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure

  vec-backfill:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: sh -c "npm run face:vec:backfill"
    environment:
      DATABASE_URL: postgresql://appuser:apppass@db:5432/app_dev
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    restart: on-failure

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3001:3000'
      - '3010:3000'
    volumes:
      - ./uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql://appuser:apppass@db:5432/app_dev
      DEV_BYPASS_AUTH: 'true'
      FACE_RECOGNITION_PROVIDER: ${FACE_RECOGNITION_PROVIDER:-embedding}
      FACE_RECOGNIZER_URL: ${FACE_RECOGNIZER_URL:-http://face-recognizer:8000}
      FACE_RECOGNITION_CANDIDATE_LIMIT: ${FACE_RECOGNITION_CANDIDATE_LIMIT:-120}
      FACE_RECOGNIZER_MIN_CONFIDENCE: ${FACE_RECOGNIZER_MIN_CONFIDENCE:-0.88}
      FACE_RECOGNIZER_AMBIGUITY_MARGIN: ${FACE_RECOGNIZER_AMBIGUITY_MARGIN:-0.3}
      FACE_RECOGNIZER_TIMEOUT_MS: ${FACE_RECOGNIZER_TIMEOUT_MS:-7000}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      vec-backfill:
        condition: service_completed_successfully
      face-recognizer:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg17
    ports:
      - '${DB_HOST_PORT:-5433}:5432'
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: app_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U appuser -d app_dev']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
